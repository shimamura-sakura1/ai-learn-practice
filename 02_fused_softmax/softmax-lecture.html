&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;softmax-row-lab&#x27;);
  const colsInput = root.querySelector(&#x27;#softmax-cols&#x27;);
  const colsValue = root.querySelector(&#x27;#softmax-cols-value&#x27;);
  const rowEl = root.querySelector(&#x27;#softmax-row&#x27;);
  const blockEl = root.querySelector(&#x27;#softmax-block-size&#x27;);
  const maxEl = root.querySelector(&#x27;#softmax-max&#x27;);
  const sumEl = root.querySelector(&#x27;#softmax-row-sum&#x27;);
  const stageLabel = root.querySelector(&#x27;#softmax-stage-label&#x27;);
  const detailEl = root.querySelector(&#x27;#softmax-detail&#x27;);
  const stepButtons = [...root.querySelectorAll(&#x27;[data-step]&#x27;)];
  const source = [2.1, 0.7, -1.2, 3.4, 1.8, -0.5, 2.7, 0.2, -2.0, 1.1, 2.4, -0.9];
  let step = 0;

  const nextPowerOfTwo = value =&gt; {
    let result = 1;
    while (result &lt; value) result *= 2;
    return result;
  };

  function stateFor(nCols, blockSize) {
    const valid = source.slice(0, nCols);
    const maximum = Math.max(...valid);
    const shifted = valid.map(value =&gt; value - maximum);
    const exponentials = shifted.map(value =&gt; Math.exp(value));
    const denominator = exponentials.reduce((sum, value) =&gt; sum + value, 0);
    const normalized = exponentials.map(value =&gt; value / denominator);
    const padded = Array(blockSize - nCols).fill(null);
    const states = [
      [...valid, ...padded],
      [...valid, ...padded],
      [...shifted, ...padded],
      [...exponentials, ...padded],
      [...normalized, ...padded],
    ];
    return { maximum, normalized, states };
  }

  function render() {
    const nCols = Number(colsInput.value);
    const blockSize = nextPowerOfTwo(nCols);
    const state = stateFor(nCols, blockSize);
    const labels = [&#x27;原始输入行&#x27;, &#x27;有效列与补齐位置&#x27;, &#x27;每个元素减去行最大值&#x27;, &#x27;逐元素计算指数&#x27;, &#x27;除以指数之和&#x27;];
    const details = [
      `program 0 负责这一整行的 ${nCols} 个有效元素。`,
      `${blockSize - nCols} 个补齐位置被 mask；读取时可视作 −∞，写回时忽略。`,
      `减去最大值 ${state.maximum.toFixed(2)} 后，最大元素变为 0，避免 exp 溢出。`,
      &#x27;指数仍保留在当前 program 的片上数据中，不写回全局显存。&#x27;,
      &#x27;行内求和后完成归一化；所有有效输出之和应接近 1。&#x27;,
    ];

    root.style.setProperty(&#x27;--softmax-block&#x27;, String(blockSize));
    colsValue.value = String(nCols);
    blockEl.textContent = String(blockSize);
    maxEl.textContent = state.maximum.toFixed(2);
    sumEl.textContent = step === 4
      ? state.normalized.reduce((sum, value) =&gt; sum + value, 0).toFixed(6)
      : &#x27;—&#x27;;
    stageLabel.textContent = labels[step];
    detailEl.textContent = details[step];
    rowEl.replaceChildren();

    state.states[step].forEach((value, index) =&gt; {
      const cell = document.createElement(&#x27;div&#x27;);
      cell.className = `softmax-cell${value === null ? &#x27; is-masked&#x27; : &#x27;&#x27;}`;
      const indexEl = document.createElement(&#x27;span&#x27;);
      indexEl.className = &#x27;softmax-cell-index text-small&#x27;;
      indexEl.textContent = String(index);
      const valueEl = document.createElement(&#x27;span&#x27;);
      valueEl.className = &#x27;softmax-cell-value&#x27;;
      valueEl.textContent = value === null ? &#x27;MASK&#x27; : value.toFixed(step === 4 ? 4 : 2);
      cell.append(indexEl, valueEl);
      rowEl.append(cell);
    });

    rowEl.setAttribute(
      &#x27;aria-label&#x27;,
      `${labels[step]}。有效列 ${nCols}，块大小 ${blockSize}。${details[step]}`
    );
    stepButtons.forEach(button =&gt; {
      const active = Number(button.dataset.step) === step;
      button.classList.toggle(&#x27;btn-primary&#x27;, active);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
    });
  }

  colsInput.addEventListener(&#x27;input&#x27;, render);
  stepButtons.forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      step = Number(button.dataset.step);
      render();
    });
  });
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
